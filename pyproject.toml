[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kufar-client"
version = "0.1.0"
description = "Unofficial read-only Kufar real-estate client and CLI"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = ["curl-cffi>=0.7"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
kufar = "kufar_client.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
